<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Colección de libros — Maia Cheb Terrab</title>
<style>
/* Helvetica Neue del sistema. En Windows cae en Arial: falta resolver una
   webfont (TeX Gyre Heros o licencia de Nimbus Sans) antes de publicar. */

:root{--papel:#fff;--tinta:#131211;--suave:#8b8781;--linea:#e6e3de;
      --gut:clamp(16px,3.2vw,36px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--papel);color:var(--tinta);
     font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;
     font-size:12px;line-height:1.3;letter-spacing:0;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block}

/* ---- nav: el nombre a la izquierda, las tres secciones a la derecha ---- */
nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px)}
nav .in{display:flex;align-items:baseline;gap:22px;padding:14px var(--gut)}
nav .yo{margin-right:auto}
nav a{color:var(--suave);transition:color .18s}
nav a:hover,nav .yo{color:var(--tinta)}

/* ---- dos columnas: la izquierda no se mueve, la derecha scrollea ---- */
.ficha{display:grid;grid-template-columns:minmax(280px,30%) 1fr;
       gap:clamp(20px,3vw,44px);padding:0 var(--gut) clamp(70px,9vw,120px);
       align-items:start}
.info{position:sticky;top:0;min-height:100vh;display:flex;flex-direction:column;
      padding:clamp(44px,7vw,104px) 0 clamp(22px,3vw,34px)}
.info h1{font:inherit}
.info .meta{color:var(--suave)}
.info .raya{margin:clamp(18px,2.4vw,28px) 0;color:var(--suave)}
.info .bajada{max-width:46ch;color:rgba(19,18,17,.74)}
.info .abajo{margin-top:auto;padding-top:34px;display:flex;
             justify-content:space-between;align-items:baseline;gap:16px}
.info .abajo a:hover{opacity:.55}

.media{padding-top:clamp(44px,7vw,104px);display:flex;flex-direction:column;gap:0}
.media .lupa{padding:0;border:0;background:#f3f1ee;cursor:zoom-in;display:block;
             width:100%;line-height:0}
.media .lupa img{width:100%;height:auto;vertical-align:top}
.par{position:relative}
.par .fuente{position:absolute;z-index:2;width:clamp(72px,14%,160px);
             right:clamp(12px,1.8vw,26px);bottom:clamp(12px,1.8vw,26px);
             background:#fff;padding:clamp(4px,.55vw,8px);
             box-shadow:0 8px 24px rgba(0,0,0,.14)}
.par .rotulo{position:absolute;z-index:2;top:clamp(12px,1.8vw,26px);
             left:clamp(12px,1.8vw,26px);color:#fff;
             text-shadow:0 1px 12px rgba(0,0,0,.55);pointer-events:none}
.embed{position:relative;height:clamp(300px,74vh,700px);
       border:1px solid var(--linea);overflow:hidden}
.embed iframe{width:100%;height:100%;border:0;display:block}

.visor{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.99);
       display:none;overflow:auto;cursor:zoom-out;padding:52px 0}
.visor.on{display:block}
.visor img{margin:0 auto;max-width:none}

@media (max-width:860px){
  .ficha{grid-template-columns:1fr}
  .info{position:static;min-height:0;padding-bottom:30px}
  .media{padding-top:0}
}
</style>
</head>
<body>
<nav><div class="in"><a class="yo" href="index.html">Maia Cheb Terrab</a><a href="index.html#visuales">Proyectos visuales</a><a href="index.html#editoriales">Proyectos editoriales</a><a href="index.html#identidad">Identidad institucional</a></div></nav><div class="ficha">
  <aside class="info">
    <h1>Colección de libros</h1>
    <div class="meta">@ Cátedra Ex-Manela, FADU  ·  [2024]</div>
    <div class="raya">—</div>
    <div class="bajada">Colección de libros para las obras completas de Samanta Schweblin.</div>
    <div class="abajo"><a href="index.html">← Índice</a><a href="p-perec.html">Plaquette Georges Perec →</a></div>
  </aside>
  <div class="media"><button class="lupa" data-src="assets/05-coleccion-de-libros/01.jpg?v=25e42fb7" data-w="5838" data-h="4392"><img src="assets/05-coleccion-de-libros/01.jpg?v=25e42fb7" width="2400" height="1805" alt="" loading="lazy"></button><button class="lupa" data-src="assets/05-coleccion-de-libros/02.jpg?v=a363a2a6" data-w="5869" data-h="2671"><img src="assets/05-coleccion-de-libros/02.jpg?v=a363a2a6" width="2400" height="1092" alt="" loading="lazy"></button><button class="lupa" data-src="assets/05-coleccion-de-libros/03.gif?v=6023067a" data-w="5834" data-h="2558"><img src="assets/05-coleccion-de-libros/03.gif?v=6023067a" width="3840" height="1684" alt="" loading="lazy"></button><button class="lupa" data-src="assets/05-coleccion-de-libros/04.jpg?v=4a431625" data-w="5835" data-h="5848"><img src="assets/05-coleccion-de-libros/04.jpg?v=4a431625" width="2394" height="2400" alt="" loading="lazy"></button><button class="lupa" data-src="assets/05-coleccion-de-libros/05.jpg?v=4b67ca07" data-w="5835" data-h="6661"><img src="assets/05-coleccion-de-libros/05.jpg?v=4b67ca07" width="2102" height="2400" alt="" loading="lazy"></button><button class="lupa" data-src="assets/05-coleccion-de-libros/06.jpg?v=2343c18c" data-w="5834" data-h="7986"><img src="assets/05-coleccion-de-libros/06.jpg?v=2343c18c" width="1753" height="2400" alt="" loading="lazy"></button><button class="lupa" data-src="assets/05-coleccion-de-libros/07.jpg?v=844d6c02" data-w="5834" data-h="4428"><img src="assets/05-coleccion-de-libros/07.jpg?v=844d6c02" width="2400" height="1821" alt="" loading="lazy"></button><button class="lupa" data-src="assets/05-coleccion-de-libros/08.jpg?v=db571799" data-w="5852" data-h="7048"><img src="assets/05-coleccion-de-libros/08.jpg?v=db571799" width="1992" height="2400" alt="" loading="lazy"></button></div>
</div>
<div class="visor"><img alt=""></div>
<script>
const visor=document.querySelector('.visor'),vimg=visor.querySelector('img');
document.querySelectorAll('.lupa').forEach(b=>b.addEventListener('click',()=>{
  vimg.src=b.dataset.src;vimg.width=b.dataset.w;vimg.height=b.dataset.h;
  visor.classList.add('on');visor.scrollTop=0;document.body.style.overflow='hidden';}));
const cerrar=()=>{visor.classList.remove('on');vimg.removeAttribute('src');
  document.body.style.overflow='';};
visor.addEventListener('click',cerrar);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});
</script>
</body>
</html>
